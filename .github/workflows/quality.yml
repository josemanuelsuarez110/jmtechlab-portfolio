name: Portfolio Quality Gate

on:
  push:
    branches:
      - main
      - security-v2
      - ci-security-v2
  pull_request:
    branches:
      - main

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check tracked environment files
        run: |
          if git ls-files | grep -Eq '(^|/)\.env($|\.)'; then
            echo "ERROR: tracked environment file detected"
            git ls-files | grep -E '(^|/)\.env($|\.)'
            exit 1
          fi

      - name: Check tracked node_modules
        run: |
          if git ls-files | grep -q '^node_modules/'; then
            echo "ERROR: node_modules is tracked"
            exit 1
          fi

      - name: Check backup files
        run: |
          if git ls-files | grep -Ei '\.(bak|backup|old|orig)$|before-'; then
            echo "ERROR: backup file detected"
            exit 1
          fi

      # ✅ Bloqueante: solo producción


      - name: Dependency audit (production, blocking)


        run: npm audit --omit=dev --audit-level=high



      # ⚠️ Informativa: dev-only, excepción braces GHSA-vfj7-8cjw-p6xm


      - name: Dependency audit (dev, informational)


        continue-on-error: true


        run: npm audit --audit-level=high || true

      - name: Lint
        run: npm run lint

      - name: Production build
        run: npm run build
